[package]
name = "netscan"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
csv = "1.4.0"
dns-lookup = "4.0.2"
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = "0.37.0"
env_logger = "0.11.11"
if-addrs = "0.15.0"
libc = "0.2.191"
log = "0.4.34"
open = "5.4.4"
pnet_datalink = "0.35.0"
pnet_packet = "0.35.0"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
surge-ping = "0.9.1"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "process"] }

[profile.release]
strip = true
